# Render Blueprint configuration for Fitlifetracker backend
services:
  - type: web
    name: fitlifetracker-1
    env: node
    plan: free
    region: ohio
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RUN_DB_SYNC
        value: true
      - key: DB_HOST
        value: dpg-d4i7vomr433s73c8ivn0-a.oregon-postgres.render.com  # ← UPDATE THIS
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: mydb_j7qm  # ← UPDATE THIS
      - key: DB_USER
        value: fitlifetracker_user
      - key: DB_PASSWORD
        value: qCE5wNJSyl6jct1eNQSgeCd0dRKzHInZ  # ← UPDATE THIS
      - key: CLIENT_URL
        value: https://fitlifetracker.vercel.app
    healthCheckPath: /health
